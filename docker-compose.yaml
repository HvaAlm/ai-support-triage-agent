services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-support-triage-n8n
    ports:
      - "5678:5678"

    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}

      - GENERIC_TIMEZONE=${TIMEZONE}
      - TZ=${TIMEZONE}

    volumes:
      - n8n_data:/home/node/.n8n

    restart: unless-stopped

volumes:
  n8n_data: