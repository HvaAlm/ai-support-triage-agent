[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-support-triage-agent"
version = "0.1.0"
description = "Persian support triage with read-only backend investigation and confirmed ticket publishing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
support-triage = "triage.__main__:main"

[tool.setuptools.packages.find]
include = ["triage*"]
